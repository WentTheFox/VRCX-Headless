# Fork-only workflow: builds the Electron desktop client for Windows and
# Linux (x64+arm64, self-signed on Windows) and macOS (Apple Silicon only,
# unsigned -- see the build-macos job's own comment for why Intel/macos-13
# was dropped, and the comment further below for why macOS is unsigned),
# and attaches the results to a DRAFT GitHub Release for the pushed tag.
#
# Triggers on the same `v*` tag push server-docker.yaml already uses, so one
# `git tag && git push` (CLAUDE.md's "Cutting a release") cuts both releases
# together.
#
# Draft, not published: this repo has GitHub's "Immutable releases" setting
# active, meaning a *published* release's assets can never be edited or
# replaced afterward -- only drafts stay mutable. This is also the first-ever
# run of self-signed cross-platform signing in this fork's history (new RIDs,
# new certs, a genuinely unverified macOS build), so staying in draft until a
# human confirms the real signed artifacts work is the only way to get a look
# before that point of no return. Switching to immediate-publish later is a
# one-line change (drop `--draft` in the publish-release job), not a redesign.
#
# Windows signing uses a self-signed Authenticode cert (CN=WentTheFox/
# C=HU/ST=Pest/L=Budapest, empty passphrase), generated once locally via
# build-scripts/generate-self-signed-certs.sh and stored as the WIN_CSC_LINK
# secret. Confirmed live: signtool.exe actually signs the real installer.
# Not CA-issued, so it reduces some SmartScreen friction but doesn't
# eliminate the warning.
#
# macOS ships UNSIGNED, deliberately -- not a gap to close later without a
# real Apple Developer ID. Found live (2026-08-18) after a long investigation
# (git history has the full trail): a self-signed PKCS12 CAN be imported into
# a keychain (a real, separate OpenSSL/macOS PBE-algorithm compatibility bug
# had to be fixed first), but electron-builder's own identity-discovery
# preflight then refuses to use it anyway, because macOS's Security framework
# flags any cert with no trusted CA chain as CSSMERR_TP_NOT_TRUSTED --
# self-signed certs can never NOT have this flag. electron-builder manages
# its signing keychain internally with no hook to mark an identity trusted
# before that check runs. A real fix means bypassing electron-builder's
# built-in mac signing (manual keychain trust + codesign, outside its
# control) -- explicitly out of scope for now.
name: Desktop Client Release

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        name: Build (${{ matrix.id }})
        runs-on: ${{ matrix.runs-on }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - id: linux-x64
                      runs-on: ubuntu-latest
                      csproj: Dotnet/VRCX-Electron.csproj
                      dotnet-arch: x64
                      dotnet-platform: x64
                      dotnet-rid: ''
                      electron-script: build-electron
                      os-family: linux
                    - id: linux-arm64
                      runs-on: ubuntu-latest
                      csproj: Dotnet/VRCX-Electron-arm64.csproj
                      dotnet-arch: arm64
                      dotnet-platform: arm64
                      dotnet-rid: ''
                      electron-script: build-electron-arm64
                      os-family: linux
                    # Windows x64's dotnet build -> pnpm -> build-electron
                    # sequence is already manually live-verified (see
                    # client-desktop/README.md's "Windows" section) -- CI
                    # automation and signing are what's new here, not the
                    # build mechanics themselves.
                    - id: win-x64
                      runs-on: windows-latest
                      csproj: Dotnet/VRCX-Electron.csproj
                      dotnet-arch: x64
                      dotnet-platform: x64
                      dotnet-rid: win-x64
                      electron-script: build-electron
                      os-family: windows
                    # Native arm64 runner, not a cross-compile from
                    # windows-latest -- avoids node-api-dotnet resolving the
                    # wrong (host-arch) prebuilt native binary via pnpm's
                    # normal optionalDependency selection. Genuinely
                    # first-of-its-kind here: verify this runner label is
                    # actually available before trusting this leg; if not,
                    # the fallback is `-r win-arm64` on windows-latest.
                    - id: win-arm64
                      runs-on: windows-11-arm
                      csproj: Dotnet/VRCX-Electron-arm64.csproj
                      dotnet-arch: arm64
                      dotnet-platform: arm64
                      dotnet-rid: win-arm64
                      electron-script: build-electron-arm64
                      os-family: windows
        defaults:
            run:
                # windows-latest/windows-11-arm default to pwsh -- matches
                # github_actions.yml's own build_dotnet_windows job, which
                # sets this for the same reason.
                shell: bash
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Setup .NET 10
              uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
              with:
                  dotnet-version: '10.0.x'

            - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
              with:
                  path: ~/.nuget/packages
                  key: ${{ runner.os }}-${{ matrix.id }}-nuget-${{ hashFiles(matrix.csproj) }}
                  restore-keys: |
                      ${{ runner.os }}-${{ matrix.id }}-nuget-

            - name: Build the .NET side (${{ matrix.id }})
              run: |
                  set -euo pipefail
                  # -r/--runtime and -a/--arch are mutually exclusive (dotnet
                  # build errors out if both are passed) -- -r already fully
                  # specifies the target RID (OS + arch), so it replaces -a
                  # rather than joining it. -p:Platform/-p:PlatformTarget are
                  # separate MSBuild properties (matching the csproj's own
                  # <Platforms>x64;ARM64</Platforms>) and stay in either case.
                  if [ -n "${{ matrix.dotnet-rid }}" ]; then
                      dotnet build '${{ matrix.csproj }}' -p:Configuration=Release -p:WarningLevel=0 -p:Platform=${{ matrix.dotnet-platform }} -p:PlatformTarget=${{ matrix.dotnet-platform }} -p:RestorePackagesConfig=true -t:"Restore;Clean;Build" -m -r ${{ matrix.dotnet-rid }}
                  else
                      dotnet build '${{ matrix.csproj }}' -p:Configuration=Release -p:WarningLevel=0 -p:Platform=${{ matrix.dotnet-platform }} -p:PlatformTarget=${{ matrix.dotnet-platform }} -p:RestorePackagesConfig=true -t:"Restore;Clean;Build" -m -a ${{ matrix.dotnet-arch }}
                  fi

            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

            - name: Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: lts/*
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            # PLATFORM=linux means "the Electron client", not "runs on
            # Linux" -- this is the correct script even for Windows/macOS
            # builds, per client-desktop/README.md.
            - name: Build the Vue app (PLATFORM=linux, i.e. the Electron client)
              run: pnpm run prod-linux

            # electron-builder treats CSC_LINK/WIN_CSC_LINK being merely SET
            # (even to an empty string) as "sign, with this identity" --
            # found live on the first dry run, unsigned builds broke with
            # "not a file" once these were set as job-level env with an
            # empty-string fallback. Exporting it only when the secret is
            # genuinely non-empty is what actually gets "no secret
            # configured yet -> unsigned build" right. No
            # WIN_CSC_KEY_PASSWORD secret exists -- Windows signing is
            # confirmed live to work with no password env var at all.
            - name: Package the Electron app (${{ matrix.id }})
              run: |
                  set -euo pipefail
                  if [ "${{ matrix.os-family }}" = "windows" ] && [ -n "${{ secrets.WIN_CSC_LINK }}" ]; then
                      export WIN_CSC_LINK="${{ secrets.WIN_CSC_LINK }}"
                  fi
                  pnpm run ${{ matrix.electron-script }}

            # Renames Windows's output to include the arch -- found live
            # (2026-08-18): electron-builder's implicit NSIS target (no
            # explicit `win` block in electron-builder.config.js) names
            # every arch's installer identically ("VRCX Setup <version>.exe",
            # no arch suffix), unlike the Linux/macOS targets which already
            # get one from build-scripts/rename-builds.js. win-x64 and
            # win-arm64 silently overwrote each other once merged into one
            # flat dist/ dir in publish-release, losing one installer
            # entirely with no error from anything until the actual release
            # was compared against by hand. Linux/macOS filenames are left
            # exactly as rename-builds.js already produces them.
            - name: Locate the built installer/AppImage/dmg
              id: artifact
              run: |
                  set -euo pipefail
                  path="$(find build -maxdepth 1 \( -name '*.AppImage' -o -name '*.exe' -o -name '*.dmg' \) -print -quit)"
                  if [ -z "$path" ]; then
                      echo "No packaged artifact found under build/ for ${{ matrix.id }}" >&2
                      exit 1
                  fi
                  if [ "${{ matrix.os-family }}" = "windows" ]; then
                      dir="$(dirname "$path")"
                      base="$(basename "$path" .exe)"
                      renamed="$dir/${base} (${{ matrix.id }}).exe"
                      mv "$path" "$renamed"
                      path="$renamed"
                  fi
                  echo "path=$path" >> "$GITHUB_OUTPUT"

            - name: Upload artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: desktop-${{ matrix.id }}
                  path: ${{ steps.artifact.outputs.path }}

    # A separate job from `build` above, not another matrix leg in it --
    # macOS runners on this account have been unreliable to schedule at all
    # (found live 2026-08-17 across four dry runs: macos-x64/macos-13 never
    # once got dispatched, and even macos-arm64/macos-latest started
    # stalling on later attempts). Apple Silicon only now, deliberately --
    # Intel (macos-13) is dropped entirely rather than kept as a
    # perpetually-stuck matrix leg. Steps mirror `build` above, just for
    # this one macOS leg, minus any signing (see the top-of-file comment).
    # Build-and-package mechanics (dotnet build, `pnpm run prod-linux`,
    # electron-builder) are confirmed working end to end.
    build-macos:
        name: Build (macos-arm64)
        runs-on: macos-latest
        env:
            CSPROJ: Dotnet/VRCX-Electron-arm64.csproj
            DOTNET_PLATFORM: arm64
            DOTNET_RID: osx-arm64
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Setup .NET 10
              uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
              with:
                  dotnet-version: '10.0.x'

            - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
              with:
                  path: ~/.nuget/packages
                  key: ${{ runner.os }}-macos-arm64-nuget-${{ hashFiles(env.CSPROJ) }}
                  restore-keys: |
                      ${{ runner.os }}-macos-arm64-nuget-

            - name: Build the .NET side (macos-arm64)
              run: dotnet build "$CSPROJ" -p:Configuration=Release -p:WarningLevel=0 -p:Platform=$DOTNET_PLATFORM -p:PlatformTarget=$DOTNET_PLATFORM -p:RestorePackagesConfig=true -t:"Restore;Clean;Build" -m -r $DOTNET_RID

            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

            - name: Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: lts/*
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - name: Build the Vue app (PLATFORM=linux, i.e. the Electron client)
              run: pnpm run prod-linux

            # Unsigned, deliberately -- see the top-of-file comment for why
            # (macOS's Security framework refuses any self-signed identity
            # regardless of keychain-import success, and electron-builder's
            # own preflight has no override for that). No CSC_LINK/
            # CSC_KEY_PASSWORD wiring here at all.
            - name: Package the Electron app (macos-arm64)
              run: pnpm run build-electron-arm64

            - name: Locate the built dmg
              id: artifact
              run: |
                  set -euo pipefail
                  path="$(find build -maxdepth 1 -name '*.dmg' -print -quit)"
                  if [ -z "$path" ]; then
                      echo "No packaged artifact found under build/ for macos-arm64" >&2
                      exit 1
                  fi
                  echo "path=$path" >> "$GITHUB_OUTPUT"

            - name: Upload artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: desktop-macos-arm64
                  path: ${{ steps.artifact.outputs.path }}

    publish-release:
        name: Publish draft release
        needs: [build, build-macos]
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            # gh release create needs a git repo context to resolve which
            # repo it's targeting -- found live (2026-08-18): without this,
            # it fails with "fatal: not a git repository" before creating
            # anything, even though GH_TOKEN and the gh CLI itself are fine.
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  # Full history + tags, not the default shallow single commit --
                  # the changelog step below walks `git log prevTag..tag`, which
                  # needs every commit and tag in between to exist locally.
                  fetch-depth: 0

            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  pattern: desktop-*
                  path: dist
                  merge-multiple: true

            - name: List collected assets
              run: ls -la dist

            # Real per-release changelog instead of the old static boilerplate
            # every release used to carry verbatim (useless for "what actually
            # changed"). Walks commits between this tag and the previous tag of
            # the same VRCX-base major (v<vrcx-base>.*.0) -- not just "the
            # previous tag overall", since that could be a much older VRCX
            # release tag (`v2026.07.18`) or another major's fork build after a
            # future upstream sync, either of which would pull in a huge,
            # irrelevant commit range. Falls back to the repo's first commit
            # when this is the major's first release (no prior tag to diff
            # against).
            - name: Build changelog
              run: |
                  set -euo pipefail
                  tag="${GITHUB_REF_NAME}"
                  major="${tag%%.*}"  # e.g. "v20260718" from "v20260718.20.0"
                  # Ascending version sort, then take the entry right before
                  # this tag -- NOT "sort descending and skip the tag itself",
                  # which would happily hand back a *newer* tag if this script
                  # ever runs for something other than the just-pushed latest
                  # (e.g. a manual backfill over old releases).
                  mapfile -t tags < <(git tag -l "${major}.*.0" --sort=v:refname)
                  prev_tag=""
                  for i in "${!tags[@]}"; do
                      if [ "${tags[$i]}" = "$tag" ]; then
                          [ "$i" -gt 0 ] && prev_tag="${tags[$((i - 1))]}"
                          break
                      fi
                  done
                  if [ -n "$prev_tag" ]; then
                      range="${prev_tag}..${tag}"
                      echo "Diffing $range (previous release: $prev_tag)"
                  else
                      range="$(git rev-list --max-parents=0 HEAD)..${tag}"
                      echo "No previous $major release tag found, diffing from repo root: $range"
                  fi
                  {
                      echo "## Changes"
                      echo
                      git log "$range" --no-merges --pretty=format:'- %s (%h)'
                      echo
                  } > changelog.md
                  cat changelog.md

            # Draft, not published -- see the top-of-file comment and
            # CLAUDE.md's "Cutting a release" section: this repo has
            # "Immutable releases" enabled, so a *published* release's
            # assets can never be replaced afterward. Staying in draft until
            # a human confirms the signed artifacts are good is the only way
            # to get a look before that point of no return. To switch to
            # immediate-publish later, drop `--draft` below -- deliberately
            # a one-line change, not a redesign.
            - name: Create draft GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  tag="${GITHUB_REF_NAME}"
                  {
                      cat changelog.md
                      echo
                      echo "## Platform notes"
                      echo
                      echo "Desktop client (Electron) build for $tag. Self-signed installers for Windows (x64/arm64), unsigned images for Linux (x64/arm64) and macOS (Apple Silicon only) -- see CLAUDE.md's \"Desktop client OS support\" table for what's actually verified per platform. Windows builds require a system-wide .NET 10 runtime install. macOS builds are unsigned -- Gatekeeper will show an 'unidentified developer' warning on first launch."
                  } > release-notes.md
                  gh release create "$tag" \
                      --draft \
                      --title "VRCX-Headless Desktop $tag" \
                      --notes-file release-notes.md \
                      dist/*
