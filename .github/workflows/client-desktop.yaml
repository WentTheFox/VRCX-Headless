# Fork-only workflow: builds the phase-5 Electron desktop client
# (client-desktop/**, src-electron/**) end to end and smoke-tests the
# resulting AppImage, so a regression here shows up on the PR instead of on
# a contributor's own machine. Documents/replaces the manual sequence in
# client-desktop/README.md; nothing upstream touches this file.
#
# Deliberately narrower than .github/workflows/github_actions.yml's own
# manual release pipeline: x64 only (arm64 needs QEMU + an emulated Electron
# boot, which isn't worth the CI minutes just to prove the build still
# compiles), no code signing, and no publish step — it uploads the AppImage
# as a workflow artifact and stops. That existing workflow remains the
# real release path; this one exists purely to catch build breaks early.
name: Desktop Client (Electron)

on:
    push:
        branches:
            - main
        paths:
            - 'client-desktop/**'
            - 'src-electron/**'
            - 'Dotnet/**'
            - 'src/**'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - '.github/workflows/client-desktop.yaml'
    pull_request:
        branches:
            - main
        paths:
            - 'client-desktop/**'
            - 'src-electron/**'
            - 'Dotnet/**'
            - 'src/**'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - '.github/workflows/client-desktop.yaml'
    workflow_dispatch:

jobs:
    build:
        name: Build and smoke-test (x64)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Setup .NET 10
              uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
              with:
                  dotnet-version: '10.0.x'

            - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
              with:
                  path: ~/.nuget/packages
                  key: ${{ runner.os }}-nuget-${{ hashFiles('**/Dotnet/VRCX-Electron.csproj') }}
                  restore-keys: |
                      ${{ runner.os }}-nuget-

            # Compiles AppApiElectron/Discord/LogWatcher/AssetBundleManager/
            # AppApiVrElectron — the real native-capability bindings phase 5
            # left untouched. Output goes to build/Electron, which pnpm run
            # build-electron below expects to already be there.
            - name: Build the .NET side (VRCX-Electron, x64)
              run: dotnet build 'Dotnet/VRCX-Electron.csproj' -p:Configuration=Release -p:WarningLevel=0 -p:Platform=x64 -p:PlatformTarget=x64 -p:RestorePackagesConfig=true -t:"Restore;Clean;Build" -m -a x64

            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

            - name: Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: lts/*
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - name: Build the Vue app (PLATFORM=linux)
              run: pnpm run prod-linux

            # Downloads a self-contained .NET runtime (network access, a
            # separate step from the dotnet build above) then runs
            # electron-builder — produces build/VRCX_<version>_x64.AppImage.
            - name: Package the Electron app
              run: pnpm run build-electron

            - name: Locate the built AppImage
              id: appimage
              run: |
                  set -euo pipefail
                  path="$(find build -maxdepth 1 -name '*.AppImage' -print -quit)"
                  if [ -z "$path" ]; then
                      echo "No AppImage found under build/" >&2
                      exit 1
                  fi
                  echo "path=$path" >> "$GITHUB_OUTPUT"

            # Upload before the smoke test below, not after: the packaged
            # app relocates and renames its own AppImage on first launch
            # (VRCX.Update's "install to ~/Applications" step, real upstream
            # behaviour, confirmed by actually running it) — booting it
            # first would silently upload a stale/missing path.
            - name: Upload AppImage artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: Electron-AppImage-x64
                  path: ${{ steps.appimage.outputs.path }}

            # electron-builder produces a valid AppImage; boot it far enough
            # to prove the packaged app actually starts under Electron
            # rather than crashing on launch (a missing native dependency,
            # a bad asar path, etc.) — the same "prove it boots before
            # calling it done" bar server-docker.yaml holds the container
            # image to. `--appimage-extract-and-run` sidesteps needing FUSE
            # (not guaranteed present on ubuntu-latest, and confirmed absent
            # on at least one real Linux desktop this was tested against);
            # `xvfb-run` supplies the real X11 display Electron's GTK init
            # needs, which is what most packaging mistakes break.
            #
            # `--x11` is required here, not optional: without it, main.js's
            # own top-level `tryRelaunchWithArgs()` (needed on a real desktop
            # so `--ozone-platform-hint=auto` actually reaches Chromium
            # before any GPU process spawns) exits this process almost
            # immediately after spawning a *detached* relaunch child —
            # `xvfb-run` sees its directly-wrapped command exit and tears
            # down the virtual X server right as that detached child is
            # still starting up and needs it, so the child dies with
            # "Missing X server or $DISPLAY". `--x11` skips that whole
            # relaunch dance and applies the ozone-platform switch directly
            # on the one process xvfb-run is actually watching. Found live
            # (2026-08-17): every run of this workflow since it was added
            # failed on exactly this, unnoticed until now.
            - name: Smoke-test the AppImage boots
              run: |
                  set -euo pipefail
                  sudo apt-get update -y
                  sudo apt-get install -y xvfb
                  chmod +x '${{ steps.appimage.outputs.path }}'
                  xvfb-run --auto-servernum -- \
                      timeout --signal=TERM 15s \
                      '${{ steps.appimage.outputs.path }}' --appimage-extract-and-run --x11 --no-sandbox --disable-gpu \
                      > appimage-boot.log 2>&1 &
                  boot_pid=$!
                  sleep 10
                  if ! kill -0 "$boot_pid" 2>/dev/null; then
                      echo "AppImage exited before the smoke-test window elapsed:" >&2
                      cat appimage-boot.log >&2
                      exit 1
                  fi
                  kill "$boot_pid" 2>/dev/null || true
                  wait "$boot_pid" 2>/dev/null || true
                  echo "AppImage was still running after 10s — treating that as a successful boot."
                  cat appimage-boot.log
