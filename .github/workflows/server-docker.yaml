# Fork-only workflow: builds and publishes the headless server container.
# Nothing upstream touches this file, so it adds no merge surface.
name: Server Container

on:
    push:
        branches:
            - main
        tags:
            - 'v*'
        paths:
            - 'server/**'
            - 'src/**'
            - 'Version'
            - '.dockerignore'
            - '.github/workflows/server-docker.yaml'
    pull_request:
        branches:
            - main
        paths:
            - 'server/**'
            - 'src/**'
            - 'Version'
            - '.dockerignore'
            - '.github/workflows/server-docker.yaml'
    workflow_dispatch:

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository_owner }}/vrcx-headless-server

jobs:
    test:
        name: Server tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: Check server/root dependency drift
              run: node server/scripts/check-deps.js
            - run: pnpm run test:server

    build:
        name: Build and publish
        needs: test
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
            - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

            # See CLAUDE.md's "Server/Docker versioning": the release
            # version is real semver with the VRCX base as the *major*
            # component — <vrcx-date-no-dots>.<minor>.<patch>, e.g.
            # 20260718.1.0 — computed here the same way
            # server/src/globals.js's buildServerVersion() does. `fork`
            # (server/VERSION) already holds the `<minor>.<patch>` pair —
            # MINOR bumps on a change that needs this server redeployed,
            # PATCH on a client-only one that doesn't, both reset to `1.0`
            # on each upstream sync; `vrcx` (the repo-root Version file) is
            # upstream's own date-based tag. A tag push
            # (`git tag v<vrcx-no-dots>.<fork>`) is what's expected to have
            # bumped server/VERSION to match — this step doesn't enforce
            # that, it just reads whatever's currently committed.
            - id: version
              run: |
                  vrcx=$(cat Version)
                  fork=$(cat server/VERSION)
                  echo "vrcx=$vrcx" >> "$GITHUB_OUTPUT"
                  echo "fork=$fork" >> "$GITHUB_OUTPUT"
                  echo "server_version=$(echo "$vrcx" | tr -d '.').$fork" >> "$GITHUB_OUTPUT"

            - id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=ref,event=branch
                      type=ref,event=pr
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=semver,pattern={{major}}
                      type=sha,format=short
                      type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

            # Build the native-arch image first and load it into the local
            # daemon, so the container is proven to actually boot before
            # anything is published. The multi-arch build below reuses this
            # layer cache, so it costs little.
            - name: Build (amd64, for smoke test)
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
              with:
                  context: .
                  file: server/Dockerfile
                  platforms: linux/amd64
                  load: true
                  tags: vrcx-headless-server:smoke
                  build-args: |
                      SERVER_VERSION=${{ steps.version.outputs.server_version }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Smoke-test the image
              run: |
                  set -euo pipefail
                  docker run --rm vrcx-headless-server:smoke migrate --create
                  docker run --rm vrcx-headless-server:smoke --help
                  label=$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.version" }}' vrcx-headless-server:smoke)
                  expected="${{ steps.version.outputs.server_version }}"
                  if [ "$label" != "$expected" ]; then
                      echo "version label mismatch: got '$label', expected '$expected'" >&2
                      exit 1
                  fi

            # A real `serve` boot, checking the bundled web client actually
            # serves at `/` — regression coverage for the exact bug this was
            # missing before: the image built and the API worked, but every
            # non-/api/* request 404'd because build/html-web was never
            # bundled at all. `migrate --create` and `serve` need to share a
            # /data volume across two separate `docker run` invocations
            # (the smoke checks above are `--rm`, single-shot, and don't
            # persist anything on purpose).
            - name: Smoke-test the web client
              run: |
                  set -euo pipefail
                  docker volume create vrcx-smoke-data
                  docker run --rm -v vrcx-smoke-data:/data vrcx-headless-server:smoke migrate --create
                  docker run -d --rm --name vrcx-smoke-serve -p 19000:9000 -v vrcx-smoke-data:/data vrcx-headless-server:smoke serve

                  # serve's boot is genuinely slow (mounting a real, if
                  # invisible, Vue app to get Pinia's inject()-based
                  # composables working outside a component — §8's "Pinia
                  # in Node" note) — observed 8-20s+ even on a warm local
                  # machine, and a real CI run needed more than the first
                  # 30s attempted here. 2 minutes, not tuned finer than
                  # that; this is a boot-time check, not a latency budget.
                  ready=false
                  for _ in $(seq 1 60); do
                      if curl -sf http://127.0.0.1:19000/ >/dev/null 2>&1; then
                          ready=true
                          break
                      fi
                      sleep 2
                  done
                  if [ "$ready" != true ]; then
                      echo "serve never came up" >&2
                      docker logs vrcx-smoke-serve
                      exit 1
                  fi

                  body=$(curl -sf http://127.0.0.1:19000/)
                  if ! echo "$body" | grep -q 'id="root"'; then
                      echo "GET / did not return the web client's index.html" >&2
                      echo "$body"
                      exit 1
                  fi
                  # /api/* must still route ahead of the static-file fallback.
                  api_status=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:19000/api/totp/setup -H 'Content-Type: application/json' -d '{}')
                  if [ "$api_status" != "200" ]; then
                      echo "/api/totp/setup returned $api_status, expected 200" >&2
                      docker logs vrcx-smoke-serve
                      exit 1
                  fi

                  docker stop vrcx-smoke-serve >/dev/null
                  docker volume rm vrcx-smoke-data >/dev/null

            - name: Log in to GHCR
              if: github.event_name != 'pull_request'
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # Pull requests stop here: they have proved the Dockerfile builds
            # and the image runs, without publishing anything.
            - name: Build and push (multi-arch)
              if: github.event_name != 'pull_request'
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
              with:
                  context: .
                  file: server/Dockerfile
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  build-args: |
                      SERVER_VERSION=${{ steps.version.outputs.server_version }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
