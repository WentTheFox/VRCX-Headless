<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, user-scalable=no" />
        <title>VRCX Headless Desktop</title>
        <style>
            /* Only used before a server connection exists — the real app
               brings its own theme via @/styles/globals.css once loaded. */
            body {
                margin: 0;
                background: #1a1a1e;
                color: #eee;
                font-family:
                    system-ui,
                    -apple-system,
                    sans-serif;
            }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <!-- Plain classic script, not a module import: this page is loaded
             raw via file://, with no Vite bundling step, so a bare
             `import qrcode from 'qrcode-generator'` specifier can't
             resolve. The UMD build's top-level `var qrcode = ...` still
             becomes a real global in a classic script regardless of its
             own (here-inert) AMD/CJS wrapper — verified directly, not
             assumed. -->
        <script src="../node_modules/qrcode-generator/dist/qrcode.js"></script>
        <script type="module" src="./setup.js"></script>
    </body>
</html>
